{{- if .Values.modelGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-model-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "model-gateway" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.modelGateway.replicas }}
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "model-gateway" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "model-gateway" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      # All outbound traffic from this pod to model providers (Bedrock/
      # PrivateLink) MUST go through the egress-proxy — never a direct call from
      # the provider SDK (D6: WS-C registers the endpoint in the allowlist).
      containers:
        - name: model-gateway
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.modelGateway.image.repository "tag" .Values.modelGateway.image.tag "digest" .Values.modelGateway.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.modelGateway.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
            {{- if .Values.extraEnvSecret }}
            # ANTHROPIC_API_KEY + LITELLM_MASTER_KEY (LiteLLM reads them from the environment).
            - secretRef:
                name: {{ .Values.extraEnvSecret }}
            {{- end }}
          env:
            - name: HTTPS_PROXY
              value: "http://{{ include "dse.fullname" . }}-egress-proxy:{{ .Values.egressProxy.port }}"
            - name: VAULT_ADDR
              value: {{ .Values.secrets.vaultAddr | quote }}
            - name: NO_PROXY
              value: ".svc,.cluster.local"
            # LiteLLM: /key/generate (virtual keys) EXIGE Postgres — sem
            # DATABASE_URL o endpoint responde 500 "DB not connected" e todo
            # caminho que minta chave real (L2/triage via model_gateway_client)
            # morre, enquanto o shim do sandbox cai para fixture e mascara.
            # Medido em produção 2026-08-12 (wi_9580d984: preview_triage_failed
            # no primeiro disparo do laço de autofix). O database `litellm` é
            # criado pelo operador (uma vez): CREATE DATABASE litellm OWNER dse;
            # as tabelas o próprio LiteLLM migra no boot.
            - name: LITELLM_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.postgresSecretName" . }}
                  key: POSTGRES_USER
            - name: LITELLM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(LITELLM_DB_USER):$(LITELLM_DB_PASSWORD)@{{ include "dse.fullname" . }}-postgres:5432/litellm"
          resources:
            {{- toYaml .Values.modelGateway.resources | nindent 12 }}
          volumeMounts:
            {{- include "dse.appTmpMount" . | nindent 12 }}
          # LiteLLM protects /health with auth (master key) -> 401 on the probe,
          # which used to restart the pod. The unauthenticated endpoints are
          # /health/liveliness and /health/readiness.
          readinessProbe:
            httpGet: { path: /health/readiness, port: {{ .Values.modelGateway.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveliness, port: {{ .Values.modelGateway.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-model-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "model-gateway" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.modelGateway.port }}
      targetPort: {{ .Values.modelGateway.port }}
      name: http
{{- end }}
