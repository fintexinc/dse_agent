{{- $allowHosts := list -}}
{{- range .Values.egressProxy.allowlist -}}
  {{- $allowHosts = append $allowHosts (printf "%s:%d" .host (int .port)) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dse.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
data:
  DSE_DEPLOYMENT_PROFILE: {{ ternary "dev" "production" (eq .Values.deploymentProfile "development") | quote }}
  DSE_TENANT_ID: {{ .Values.tenant.id | quote }}
  DSE_DATA_CLASS: {{ .Values.tenant.dataClass | quote }}
  DSE_DATABASE_HOST: {{ include "dse.fullname" . }}-postgres
  DSE_DATABASE_PORT: "5432"
  DSE_DATABASE_NAME: {{ .Values.postgres.auth.database | quote }}
  DSE_TEMPORAL_HOST: {{ include "dse.fullname" . }}-temporal
  DSE_TEMPORAL_PORT: "7233"
  DSE_TEMPORAL_ADDRESS: "{{ include "dse.fullname" . }}-temporal:7233"
  DSE_TEMPORAL_TASK_QUEUE: "dse-core-task-queue"
  DSE_REDIS_HOST: {{ include "dse.fullname" . }}-redis
  DSE_REDIS_PORT: "6379"
  VAULT_ADDR: {{ .Values.secrets.vaultAddr | quote }}
  # FQDN, not the short name: the sandbox Pod runs in runtime.sandboxNamespace,
  # whose search domains do not find the egress-proxy Service in global.namespace.
  # Without the FQDN the Pod's HTTP(S)_PROXY gets NXDOMAIN and the in-pod clone fails.
  DSE_EGRESS_PROXY_URL: "http://{{ include "dse.fullname" . }}-egress-proxy.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.egressProxy.port }}"
  # FQDN, not the short name: the orchestrator and the sandbox Pod carry
  # HTTPS_PROXY=egress-proxy + NO_PROXY=.svc,.cluster.local. With a short name the
  # call to the model-gateway is hijacked by the proxy (internal host outside the
  # allowlist) → 502 with an empty body, the Planner returns an empty plan and the
  # turn escalates. The FQDN matches NO_PROXY and the call goes straight to the Service.
  DSE_MODEL_GATEWAY_URL: "http://{{ include "dse.fullname" . }}-model-gateway.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.modelGateway.port }}"
  DSE_MODEL_GATEWAY_BASE_URL: "http://{{ include "dse.fullname" . }}-model-gateway.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.modelGateway.port }}"
  DSE_MODEL_GATEWAY_ALLOW_FIXTURE: {{ ternary "1" "0" .Values.modelGateway.allowFixture | quote }}
  # Adapter URLs for post_tracking_comment (status back to Slack/GitHub via
  # /internal/status-comment). FQDN, not the short name, for 2 reasons: (1) the
  # code default is "http://adapter-slack:8801" — wrong name (the Service is
  # dse-<...>-adapter-slack) AND missing .svc; (2) the orchestrator has HTTPS_PROXY —
  # a short name is hijacked by the egress-proxy (403). The FQDN matches NO_PROXY.
  DSE_ADAPTER_GITHUB_URL: "http://{{ include "dse.fullname" . }}-adapter-github.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.adapters.github.port }}"
  DSE_ADAPTER_SLACK_URL: "http://{{ include "dse.fullname" . }}-adapter-slack.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.adapters.slack.port }}"
  {{- if .Values.adapters.jira.enabled }}
  # FQDN, not the short name: a short name is not in NO_PROXY (.svc,
  # .cluster.local), so the request would be hijacked by the egress proxy and
  # come back 403 — the exact failure that silenced the GitHub and Slack status
  # comments before.
  DSE_ADAPTER_JIRA_URL: "http://{{ include "dse.fullname" . }}-adapter-jira.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.adapters.jira.port }}"
  {{- end }}
  DSE_SANDBOX_INPROCESS: {{ ternary "1" "0" .Values.runtime.inProcess | quote }}
  # merge-base (WSE-E6-T16): a raiz onde o update_base_branch provisiona o
  # workspace on-demand. O default de código aponta para dentro da imagem, que
  # roda com readOnlyRootFilesystem — /tmp é o único chão gravável do pod
  # (emptyDir dse-runtime-tmp). O código ainda cai para o tmp sozinho se esta
  # env faltar; declará-la aqui é intenção, não mecanismo.
  DSE_WSE_GIT_ROOT: "/tmp/dse-merge-base"
  DSE_SANDBOX_LOCAL_FALLBACK_ALLOWED: {{ ternary "1" "0" .Values.runtime.localFallbackAllowed | quote }}
  DSE_SANDBOX_RUNTIME_CLASS: {{ .Values.runtime.sandboxRuntimeClassName | quote }}
  DSE_CODER_SUBSTRATE: {{ .Values.runtime.agentSubstrate | quote }}
  # Sandbox driver + K8s provisioning config (consumed by
  # sandbox_runtime.driver.select_sandbox_driver and k8s_driver.K8sSandboxConfig).
  DSE_SANDBOX_DRIVER: {{ .Values.runtime.sandboxDriver | quote }}
  DSE_SANDBOX_K8S_NAMESPACE: {{ .Values.runtime.sandboxNamespace | quote }}
  DSE_AGENT_RUNNER_IMAGE: {{ include "dse.image" (dict "root" $ "repository" .Values.runtime.agentRunnerImage.repository "tag" .Values.runtime.agentRunnerImage.tag "digest" .Values.runtime.agentRunnerImage.digest) | quote }}
  # SA the sandbox POD runs as (no RBAC) — same as the object created in
  # deploy/k8s/sandbox-isolation.yaml. NOT the worker's SA (that one holds the RBAC).
  DSE_SANDBOX_SERVICE_ACCOUNT: "dse-sandbox-runner"
  DSE_SANDBOX_CPU_LIMIT: {{ .Values.runtime.sandboxCpuLimit | quote }}
  DSE_SANDBOX_MEM_LIMIT: {{ .Values.runtime.sandboxMemLimit | quote }}
  DSE_SANDBOX_TTL_SECONDS: {{ .Values.runtime.sandboxTtlSeconds | quote }}
  DSE_SANDBOX_CHECKPOINT_PVC: {{ if .Values.runtime.checkpointPvc.enabled }}{{ include "dse.fullname" . }}-sandbox-checkpoint{{ else }}""{{ end }}
  # Per-WorkItem dollar ceiling applied when work_items.budget carries no
  # max_usd of its own — which is every item today. 0 disables it.
  DSE_DEFAULT_WORK_ITEM_MAX_USD: {{ .Values.orchestrator.defaultWorkItemMaxUsd | quote }}
  # Teto de TENTATIVAS do Coder (turnos), distinto do teto de GASTO acima:
  # foi ele que encerrou os itens do dia com ~US$ 3,59 de 25 gastos.
  DSE_CODER_RETRY_CAP: {{ .Values.orchestrator.coderRetryCap | quote }}
  DSE_WORKER_USE_VERSIONING: {{ ternary "true" "false" .Values.orchestrator.workerVersioning.enabled | quote }}
  DSE_WORKER_BUILD_ID: {{ .Values.orchestrator.workerVersioning.buildId | quote }}
  DSE_EGRESS_PORT: {{ .Values.egressProxy.port | quote }}
  DSE_EGRESS_TENANT_ID: {{ .Values.tenant.id | quote }}
  DSE_EGRESS_MODEL_GATEWAY_HOST: {{ include "dse.fullname" . }}-model-gateway
  DSE_EGRESS_MODEL_GATEWAY_PORT: {{ .Values.modelGateway.port | quote }}
  DSE_EGRESS_REPO_HOST: {{ .Values.egressProxy.repoHost | quote }}
  DSE_EGRESS_CREDENTIAL_BROKER_ENABLED: {{ ternary "1" "0" .Values.egressProxy.credentialBroker.enabled | quote }}
  DSE_EGRESS_CREDENTIAL_ALLOW_FIXTURE: {{ ternary "1" "0" .Values.egressProxy.credentialBroker.allowFixture | quote }}
  # Compatible with the current implementation. The file below stays mounted
  # for the future strict policy; the pilot gate does not declare it verified.
  DSE_EGRESS_ALLOW_HOSTS: {{ join "," $allowHosts | quote }}
  {{- if .Values.preview.enabled }}
  DSE_PREVIEW_MODE: {{ .Values.preview.mode | quote }}
  DSE_PREVIEW_APPLY: {{ .Values.preview.apply | quote }}
  DSE_PREVIEW_KUBE_CONTEXT: {{ .Values.preview.kubeContext | quote }}
  DSE_PREVIEW_SOURCE_IMAGE: {{ .Values.preview.sourceImage | quote }}
  DSE_PREVIEW_SOURCE_PORT: {{ .Values.preview.sourcePort | quote }}
  DSE_PREVIEW_EXTERNAL_HOST: {{ .Values.preview.externalHostTemplate | quote }}
  DSE_PREVIEW_INGRESS_CLASS: {{ .Values.preview.ingressClass | quote }}
  DSE_PREVIEW_TTL_SECONDS: {{ .Values.preview.ttlSeconds | quote }}
  DSE_PREVIEW_MAX_CONCURRENT: {{ .Values.preview.maxConcurrent | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://{{ include "dse.fullname" . }}-otel-collector:4317"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dse.fullname" . }}-egress-allowlist
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
data:
  allowlist.yaml: |
    # Consumed by the egress-proxy (WS-C) as the source of truth for the
    # default-deny policy — WS-F signs off on this list (WSF-E2).
    hosts:
      {{- range .Values.egressProxy.allowlist }}
      - host: {{ .host | quote }}
        port: {{ .port }}
        purpose: {{ .purpose | quote }}
      {{- end }}
