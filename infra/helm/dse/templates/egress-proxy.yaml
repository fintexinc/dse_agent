{{- if .Values.egressProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-egress-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "egress-proxy" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.egressProxy.replicas }}
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "egress-proxy" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "egress-proxy" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      containers:
        - name: egress-proxy
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.egressProxy.image.repository "tag" .Values.egressProxy.image.tag "digest" .Values.egressProxy.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.egressProxy.port }}
              name: proxy
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
            {{- if .Values.extraEnvSecret }}
            # GitHub App — the proxy MINTS the installation token for the git
            # smart-HTTP relay, so the sandbox never holds one. Without this the
            # broker degrades to a fixture token, which GitHub 401s.
            - secretRef:
                name: {{ .Values.extraEnvSecret }}
            {{- end }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.secrets.vaultAddr | quote }}
          volumeMounts:
            {{- include "dse.appTmpMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
          readinessProbe:
            # The current proxy does not expose an HTTP /health. TCP only proves
            # the listener is up; policy semantics are an external gate.
            tcpSocket: { port: {{ .Values.egressProxy.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: {{ .Values.egressProxy.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: dse-runtime-tmp
          emptyDir:
            sizeLimit: {{ .Values.security.tmpSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-egress-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "egress-proxy" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.egressProxy.port }}
      targetPort: {{ .Values.egressProxy.port }}
      name: proxy
{{- end }}
