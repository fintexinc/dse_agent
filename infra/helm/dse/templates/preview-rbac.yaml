{{/*
RBAC for per-PR preview environments.

A preview lives in its own namespace (`preview-<work_item_id>`), created on
demand, so the worker needs cluster-scoped permission — Kubernetes RBAC cannot
scope a grant to a namespace NAME PATTERN, only to namespaces that already
exist. That makes this the widest grant in the chart, so it is deliberately
narrow in the other axis: exactly the object kinds a preview is made of, and no
configmap/RBAC access at all.

Secrets (G-1', 2026-08-09): the preview needs its clone credential mounted from
a Secret, so `create` is granted broadly (RBAC cannot name an object that does
not exist yet) while read/modify is pinned by `resourceNames` to the single
name the preview uses. A compromised worker can create Secrets and can
read/modify ONLY `dse-preview-deploy-key` — never `dse-poc-secrets`, Vault's or
Postgres's. The original property ("cannot read a Secret anywhere") is narrowed
by exactly one name, deliberately and no further.

Off by default. Turn it on only where previews actually run.
*/}}
{{- if .Values.runtime.previewRbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dse.fullname" . }}-preview-manager
  labels:
    {{- include "dse.labels" . | nindent 4 }}
rules:
  # Namespace lifecycle: one per preview, deleted by the TTL reaper. Without
  # `delete` the reaper cannot collect anything and previews leak forever —
  # which matters more here than under GitOps, where Argo CD used to prune.
  # `patch`/`update` porque um REFRESH re-aplica o manifesto de um namespace
  # que já existe, e `kubectl apply` sobre objeto existente é um patch — sem
  # eles o refresh morre em Forbidden (medido 2026-08-09) e o TTL nunca é
  # renovado. Não amplia o risco de forma relevante: `delete` já é concedido
  # aqui, e apagar um namespace é estritamente pior que anotá-lo.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # G-1' (2026-08-09): a credencial de clone (installation token da App, ou a
  # deploy key semeada) é materializada como Secret NO NAMESPACE DO PREVIEW —
  # é o que mantém o token fora do pod spec e de argv. Sem isto o provision
  # morre em `secrets is forbidden` (medido em produção).
  #
  # `resourceNames` é o que preserva a propriedade declarada no cabeçalho: o
  # worker só lê/altera secrets com ESTE nome exato — `dse-poc-secrets`, as do
  # Vault e as do Postgres seguem inalcançáveis. `create` não aceita
  # resourceNames (a RBAC do k8s não conhece o nome antes do objeto existir),
  # então ele fica amplo: o worker pode CRIAR uma secret qualquer, o que não
  # dá leitura de nada.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # `dse-preview-build-credentials` (Fase A1, 2026-08-19): o settings.xml do
  # feed privado que o build do preview monta. Precisa estar AQUI porque
  # `kubectl apply` sobre objeto existente é um patch — sem o nome, o RE-apply
  # num namespace vivo (refresh do preview) morre em Forbidden.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dse-preview-deploy-key", "dse-preview-build-credentials"]
    verbs: ["get", "update", "patch", "delete"]
  # Read-only: `kubectl wait` watches the Deployment, and reading pod status is
  # how a stuck preview gets diagnosed. No exec, no delete.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # `pods/log` é o que alimenta a captura de `pod_failure_detail` (rc.83/84):
  # o motivo de um preview morto mora no stdout do pod. Sem este grant a
  # feature inteira morre em Forbidden — medido em produção (PR #6,
  # wi_a8b760de…, 2026-08-11): duas tentativas, dois Forbidden, e a PR ficou
  # com o timeout pelado. É leitura do stdout de código que o próprio DSE
  # gerou, num role que já lê o pod inteiro; exec segue proibido.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dse.fullname" . }}-preview-manager
  labels:
    {{- include "dse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dse.fullname" . }}-orchestrator-worker
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dse.fullname" . }}-preview-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
