{{/*
L3/L4 containment. Stock NetworkPolicy does not understand FQDNs: only the
egress-proxy gets a route to external CIDRs; the per-hostname decision stays in
the proxy. The cluster CNI must enforce NetworkPolicy (Calico/Cilium etc.).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-default-deny-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress: []
---
# Every pod may talk only to the cluster DNS for resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-allow-cluster-dns
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Application workloads only reach the enumerated internal dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-application-internal-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - adapter-slack
          - adapter-github
          # The two Jira workers carry their own component name, so they need
          # explicit entries: without them they fall under default-deny and the
          # poller cannot even reach Postgres.
          - adapter-jira
          - adapter-jira-poller
          - adapter-jira-transition
          - adapter-teams
          # Reads the system of record and writes console_rm — both in the same
          # Postgres, so the existing rule below is all it needs.
          - console-projector
          - ingest-gateway
          - validation
          - orchestrator
          - model-gateway
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - { protocol: TCP, port: 7233 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: model-gateway
      ports:
        - { protocol: TCP, port: {{ .Values.modelGateway.port }} }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - { protocol: TCP, port: {{ .Values.egressProxy.port }} }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - { protocol: TCP, port: 8200 }
    # Outbound status comment: the orchestrator posts the tracking comment by
    # calling the adapter's HTTP endpoint (DSE_ADAPTER_*_URL). Without this route
    # post_tracking_comment gets Connection refused under the default-deny and
    # Slack/GitHub get no feedback (the PR still lands because finalize_pr goes
    # straight to the API through the egress-proxy). Enumerated, not wildcarded.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adapter-slack
      ports:
        - { protocol: TCP, port: {{ .Values.adapters.slack.port }} }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adapter-github
      ports:
        - { protocol: TCP, port: {{ .Values.adapters.github.port }} }
    {{- if .Values.adapters.jira.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adapter-jira
      ports:
        - { protocol: TCP, port: {{ .Values.adapters.jira.port }} }
    {{- end }}
    {{- if .Values.adapters.teams.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adapter-teams
      ports:
        - { protocol: TCP, port: {{ .Values.adapters.teams.port }} }
    {{- end }}
---
# Self-hosted Temporal only needs the internal Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-temporal-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-temporal-ui-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - { protocol: TCP, port: 7233 }
# A política do SANDBOX não está neste arquivo: ela vive em
# `deploy/k8s/sandbox-isolation.yaml`, aplicada como pré-requisito do
# runbook, porque o Pod nasce em `runtime.sandboxNamespace` e não neste
# namespace. O que existia aqui era uma cópia MORTA — selecionava
# `dse.sandbox: "true"`, label que nada produz (os reais são
# `app.kubernetes.io/managed-by: dse-sandbox` e `dse.fintex/*`) — e dava a
# impressão de que a contenção vinha do chart. Removida em 2026-08-20.
---
# The only external exception. Internal networks and metadata must be listed in `except`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-egress-proxy-external
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - { protocol: TCP, port: 8200 }
    {{- range .Values.networkPolicy.egressProxyExternalCidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
{{- if .Values.runtime.sandboxRbac.create }}
---
# Route from the orchestrator worker to the K8s API server — the kubectl that
# creates the sandbox Pods. Only exists with sandboxDriver=k8s; under the
# default-deny the orchestrator would not reach the apiserver without this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dse.fullname" . }}-orchestrator-kube-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
  policyTypes: ["Egress"]
  egress:
    {{- range .Values.networkPolicy.kubeApiServer.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        - { protocol: TCP, port: {{ $.Values.networkPolicy.kubeApiServer.port }} }
    {{- end }}
{{- end }}
{{- end }}
