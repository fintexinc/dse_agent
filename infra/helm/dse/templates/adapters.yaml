{{/*
Adapters (WS-A) + ingest-gateway (WS-A) + validation/PR finalizer (WS-E) — all
of them are plain HTTP services (webhook receivers) with the same
Deployment+Service shape. Webhook secrets (Slack signing secret, GitHub App
private key) come from the secrets backend (WSF-E2-T3a) through an env var
referencing a Secret populated by an ExternalSecret — never hardcoded here.
*/}}
{{- if .Values.adapters.slack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}-adapter-slack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dse.labels" . | nindent 8 }}
        {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 8 }}
    spec:
      {{- include "dse.appPodDefaults" . | nindent 6 }}
      containers:
        - name: adapter-slack
          image: {{ include "dse.image" (dict "root" $ "repository" .Values.adapters.slack.image.repository "tag" .Values.adapters.slack.image.tag "digest" .Values.adapters.slack.image.digest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "dse.appContainerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.adapters.slack.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "dse.fullname" . }}-config
            - secretRef:
                name: {{ include "dse.postgresSecretName" . }}
            {{- if .Values.extraEnvSecret }}
            # SLACK_BOT_TOKEN + SLACK_SIGNING_SECRET (config._from_vault_or_env
            # reads them from the environment). See extraEnvSecret in values.yaml.
            - secretRef:
                name: {{ .Values.extraEnvSecret }}
            {{- end }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.secrets.vaultAddr | quote }}
            - name: HTTPS_PROXY
              value: "http://{{ include "dse.fullname" . }}-egress-proxy:{{ .Values.egressProxy.port }}"
            - name: NO_PROXY
              value: ".svc,.cluster.local"
          resources:
            {{- toYaml .Values.adapters.slack.resources | nindent 12 }}
          volumeMounts:
            {{- include "dse.appTmpMount" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health, port: {{ .Values.adapters.slack.port }} }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.adapters.slack.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.adapters.slack.port }} }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-adapter-slack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "adapter-slack" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.adapters.slack.port }}
      targetPort: {{ .Values.adapters.slack.port }}
      name: http
{{- end }}

