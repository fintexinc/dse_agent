            httpGet: { path: /health, port: {{ .Values.adapters.teams.port }} }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.adapters.teams.port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.adapters.teams.port }} }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dse.fullname" . }}-adapter-teams
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dse.selectorLabels" (dict "component" "adapter-teams" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.adapters.teams.port }}
      targetPort: {{ .Values.adapters.teams.port }}
      name: http
{{- end }}
