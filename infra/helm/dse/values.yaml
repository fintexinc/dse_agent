# Fintex DSE — values.yaml (topology A: one installation = one tenant = one
# namespace inside the customer's own VPC/K8s). Parameterized per tenant:
# run `helm install dse-<tenant> infra/helm/dse -f values-<tenant>.yaml`
# with a per-customer overrides file (never commit real production values —
# use `--set` fed from the secrets backend/CI instead).

tenant:
  id: "acme-dev"            # used in labels, resource names and as the default tenant_id
  dataClass: "internal"     # internal | confidential | restricted (maps to the residency NFR)

# The base chart stays safe for local development. The `pilot` and `production`
# profiles turn on fail-closed validations in templates/_helpers.tpl: they cannot
# be rendered while keeping fixtures, in-process execution, default credentials
# or mandatory components switched off.
deploymentProfile: development  # development | pilot | production

# Optional K8s Secret (name) mounted via envFrom ON the model-gateway AND on the
# orchestrator. Used by the POC to inject ANTHROPIC_API_KEY/LITELLM_MASTER_KEY
# (LiteLLM reads them from the environment, not from Vault) + GitHub App creds
# (finalize_pr / virtual key minting run in the orchestrator). Empty = nothing is
# injected. In strict production, prefer ESO/Vault Agent over a plain secret.
extraEnvSecret: ""

# Gates that depend on evidence external to Helm (image/migration conformance
# tests). They intentionally stay false in the repository. Only the release
# pipeline, after verifying the immutable digests, should promote them. This
# prevents `helm template` from being mistaken for proof that the runtime/ledger
# implement controls the chart cannot inspect.
pilotReadiness:
  sandboxIsolationVerified: false
  modelGatewayFailClosedVerified: false
  egressStrictPolicyVerified: false
  auditLedgerMigrationsVerified: false
  workerVersioningRegistrationVerified: false

global:
  namespace: dse
  imageRegistry: ""          # e.g. "123456789.dkr.ecr.us-east-1.amazonaws.com/" (with a trailing slash) — empty = Docker Hub/public registry
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []       # docker-registry Secret names, if the customer's registry requires them
  labels: {}                 # extra labels applied to every resource (e.g. cost-center)

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# Pod Security Standards "restricted" defaults for application workloads.
# Infrastructure images that need to write to the rootfs use the
# `statefulContainerSecurityContext` profile, but still run without privilege
# escalation and without Linux capabilities.
security:
  tmpSizeLimit: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  appContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  statefulContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

# Migrations as a Helm hook Job (Phase 5 — self-sufficient deploy).
migrations:
  enabled: true

runtime:
  # The only value allowed in the pilot/production profiles. `false` makes the
  # current runtime fail closed on K8s (no Docker socket is mounted); the real
  # Kubernetes provisioner remains an external blocker and is covered by the
  # pilotReadiness.sandboxIsolationVerified gate.
  inProcess: true
  localFallbackAllowed: true
  agentSubstrate: fixture
  sandboxRuntimeClassName: ""
  # Sandbox driver: "docker" (local dev, host-visible workspace) or "k8s"
  # (an ephemeral gVisor Pod per task; the worker creates/execs/deletes via kubectl).
  sandboxDriver: "docker"
  # Namespace for the sandbox Pods — SEPARATE from the control plane (PSA
  # restricted + its own NetworkPolicies in deploy/k8s/sandbox-isolation.yaml).
  sandboxNamespace: "dse-sandboxes"
  # Worker RBAC (dedicated SA + Role to create/exec/delete pods in
  # sandboxNamespace). Turn on ONLY with sandboxDriver=k8s.
  sandboxRbac:
    create: false
  # Cluster-scoped grant that lets the worker create/delete preview namespaces.
  # Off by default because it is the widest permission the chart hands out —
  # see templates/preview-rbac.yaml for why it cannot be namespace-scoped.
  previewRbac:
    create: false
  # The agent-runner image that runs INSIDE the sandbox Pod (pinned by digest in
  # the strict profile, like every other component).
  agentRunnerImage:
    repository: dse/agent-runner
    tag: "0.1.0"
    digest: ""
  sandboxCpuLimit: "1"
  sandboxMemLimit: "2Gi"
  # `id` do <repository> privado no POM do repo alvo. Vazio = sem feed
  # privado, e o settings.xml do sandbox sai como sempre saiu.
  mavenFeedId: ""
  # Absolute lifetime stamped on each sandbox Pod (annotation
  # dse.fintex/expires-at) and enforced by the sandbox-reaper CronJob. It is the
  # BACKSTOP for Pods whose workflow died without calling teardown_sandbox — the
  # normal path is still teardown on every terminal branch.
  #
  # 72h, not 24h: a reaped sandbox is NOT transparently rebuilt. The next agent
  # turn fails to exec, retries until schedule_to_close and the work item ends
  # `failed`. Size this beyond realistic human-review dwell time, not just
  # beyond the working phase. 0 disables both the stamp and the reaper.
  sandboxTtlSeconds: 259200
  # How often the reaper sweeps.
  sandboxReaperSchedule: "*/10 * * * *"
  # Grace before a Succeeded/Failed sandbox Pod is collected, so a crashed
  # sandbox can still be inspected. The worker has no pods/log RBAC, so
  # `kubectl describe` is the only forensic surface there is.
  sandboxReaperTerminatedGraceSeconds: 900
  # PVC for the sandbox's git checkpoint (recovery after chaos/rebuild). emptyDir
  # is enough for the 1st turn; the PVC is a fast-follow.
  checkpointPvc:
    enabled: false
    size: 5Gi
    storageClassName: ""

# ---------------------------------------------------------------------------
# Postgres — the control plane (work_items/audit_log/etc.) lives in the
# customer's VPC under topology A (decision fixed in WSF-E5-T1). Production
# should prefer a managed Postgres (RDS/CloudSQL) with PITR over this
# StatefulSet — see infra/RUNBOOK-UPGRADE.md and infra/OSS-BOM.md. This chart
# covers the self-managed-in-cluster case for environments with no managed
# service available.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    digest: ""
  auth:
    # Dev/local only — production MUST use existingSecret (populated via
    # ExternalSecret/Vault, never plaintext values in this values.yaml).
    existingSecret: ""
    username: dse
    password: dse_dev_only
    database: dse
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# ---------------------------------------------------------------------------
# Temporal — durable orchestration (WS-B). auto-setup for Phase 1/pilot;
# production should move to Temporal Cloud or a dedicated multi-node
# self-hosted cluster (see RUNBOOK-UPGRADE.md, Worker Versioning).
# ---------------------------------------------------------------------------
temporal:
  enabled: true
  # Retention of the `default` namespace's workflow history. Temporal's own
  # minimum is 24h, which is also auto-setup's default — too short to answer
  # "what did this work item already do, and is re-running it safe?" the day
  # after it stalls. 720h = 30d costs little at this scale (the temporal
  # databases are 79MB + 11MB for ~31 executions).
  # Applied at namespace CREATION only — see the note in templates/temporal.yaml
  # before assuming a helm upgrade repairs an existing cluster.
  namespaceRetention: "720h"
  image:
    repository: temporalio/auto-setup
    tag: "1.29"
    digest: ""
  ui:
    enabled: true
    image:
      repository: temporalio/ui
      tag: "2.31.2"
      digest: ""
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    digest: ""
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Vault — in production, set `externallyManaged: true` and point
# `secrets.vaultAddr` at the customer's own Vault/HSM (or a dedicated HA Vault
# cluster) — this chart's `dev mode` (the same image as the foundation's
# docker-compose) must NEVER run in production (in-memory data, a single unseal key).
# ---------------------------------------------------------------------------
vault:
  externallyManaged: false
  devMode: true
  image:
    repository: hashicorp/vault
    tag: "1.17"
    digest: ""
  devRootToken: ""  # production: never set it here — generate and store it outside the chart
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Secrets backend (WSF-E2-T3a) — how the other services obtain credentials.
# `externalSecrets.enabled: true` requires the External Secrets Operator (ESO)
# to be already installed in the cluster; otherwise the services read
# VAULT_ADDR/VAULT_TOKEN straight from env (dev/staging only).
# ---------------------------------------------------------------------------
secrets:
  vaultAddr: "http://dse-vault:8200"
  externalSecrets:
    enabled: false
    secretStoreRef: "dse-vault-backend"
    secretStoreKind: ClusterSecretStore  # pilot/production require a namespaced SecretStore
    refreshInterval: "1h"
    remoteKey: ""  # empty => dse/<tenant.id>/postgres

# ---------------------------------------------------------------------------
# Egress proxy (WS-C builds it, WS-F signs off on the policy — WSF-E2).
# `allowlist` is injected as a ConfigMap mounted by the proxy; never hardcode
# tokens here (the proxy fetches ephemeral credentials from the secrets backend).
# ---------------------------------------------------------------------------
egressProxy:
  enabled: true
  image:
    repository: dse/egress-proxy
    tag: "0.1.0"
    digest: ""
  replicas: 2
  port: 8806
  repoHost: "github.com"
  credentialBroker:
    enabled: true
    allowFixture: true
  allowlist:
    - host: "api.github.com"
      port: 443
      purpose: "GitHub App API (PR finalizer, status comments)"
    - host: "github.com"
      port: 443
      purpose: "clone the target repository inside the sandbox (git through the proxy)"
    - host: "slack.com"
      port: 443
      purpose: "Slack Web API (status message)"
    - host: "*.amazonaws.com"
      port: 443
      purpose: "Bedrock PrivateLink (model-gateway tier 1)"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# Model gateway (WS-D) — LiteLLM. The per-tenant/task/stage virtual key comes
# from the secrets backend, never from this values.yaml.
# ---------------------------------------------------------------------------
modelGateway:
  enabled: true
  image:
    repository: dse/model-gateway
    tag: "0.1.0"
    digest: ""
  allowFixture: true
  replicas: 1
  port: 4000
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

# ---------------------------------------------------------------------------
# Orchestrator (WS-B) — Temporal worker. Safe to scale horizontally (Temporal
# balances tasks across the workers on the same task queue).
# ---------------------------------------------------------------------------
orchestrator:
  enabled: true
  image:
    repository: dse/orchestrator
    tag: "0.1.0"
    digest: ""
  replicas: 2
  healthPort: 8900
  # Per-WorkItem dollar ceiling, applied at every phase boundary when the work
  # item carries no max_usd of its own. Without it NOTHING denominated in money
  # can end a run: measured burn on the pilot cluster was $11.74 on a single
  # item in 9m14s (~$108/h), and review_round_cap permits roughly $60 by design.
  # 0 disables the ceiling and restores that behaviour.
  defaultWorkItemMaxUsd: 25.0
  # Turnos do Coder por item. Compartilhado com o laço do Tester.
  coderRetryCap: 3
  workerVersioning:
    enabled: false
    buildId: "dev"
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

# ---------------------------------------------------------------------------
# Adapters + ingest-gateway (WS-A)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Per-PR preview environments. `mode: source` runs the branch straight from
# source and needs neither a Docker daemon nor a registry, which is what makes
# it viable on the k3s/gVisor substrate; `mode: image` is the original design
# and expects a prebuilt image. `apply: kubectl` skips Argo CD entirely — see
# templates/preview-rbac.yaml for the permission that path requires.
# ---------------------------------------------------------------------------
preview:
  enabled: false
  mode: "image"
  apply: "gitops"
  # Empty means "use the ambient credentials" (the pod's service account).
  # A named context only exists on a developer machine.
  kubeContext: ""
  sourceImage: "node:22-alpine"
  sourcePort: 3000
  # `{namespace}` is substituted. Empty means no Ingress is created and the URL
  # stays cluster-internal — i.e. not clickable, which defeats the purpose.
  externalHostTemplate: ""
  ingressClass: "traefik"
  ttlSeconds: 3600
  maxConcurrent: 3
  # How often expired preview namespaces are collected. Only meaningful with
  # apply=kubectl, where nothing else prunes them.
  reaperSchedule: "*/10 * * * *"

# ---------------------------------------------------------------------------
# Scheduled recovery of human replies whose delivery was lost. The Jira poller
# runs its own loop; this drives the two webhook-driven adapters.
# ---------------------------------------------------------------------------
# Escalates work items whose workflow no longer exists. The detection has been
# in ingest_gateway/stranded.py since 2026-07-24 and nothing called it: ten rows
# sat in implementing/queued/new/ci_pending for up to 119 hours, showing in the
# console as work in progress. Recovery code that nothing invokes is worse than
# absent, because the runbook then claims the failure mode is handled.
strandedSweep:
  enabled: true
  # Hourly. The window below is what decides whether an item is stranded; the
  # schedule only decides how soon after that it is noticed.
  schedule: "17 * * * *"
  # 6h: comfortably above any legitimate step (a coder turn runs minutes, the CI
  # wait writes a row every 60s) and below "decorates the console for a week".
  # Human waits — plan approval, review — are excluded by the query itself, not
  # by this number.
  idleSeconds: 21600
  # A sweep finding dozens has found a systemic failure, not stragglers.
  # Escalating them all at once would bury the signal in the ledger.
  limit: 25

replyReconciler:
  enabled: false
  # A safety net for an already-lost delivery, not a delivery path — recovering
  # a reply a couple of minutes late is a success.
  schedule: "*/2 * * * *"
  targets: {}


# ---------------------------------------------------------------------------
# console-projector — materializes the `console_rm` read model that the admin
# console (dse_console_pane) reads. Without it that schema stays empty and the
# console shows nothing, however healthy the engine is.
# ---------------------------------------------------------------------------
consoleProjector:
  enabled: false
  image: { repository: dse/console-projector, tag: "0.1.0", digest: "" }
  # The console feels live at a couple of seconds; below that it is just more
  # transactions for the same picture.
  intervalSeconds: 2
  batch: 2000
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "400m", memory: "384Mi" }


# ---------------------------------------------------------------------------
# Admin console (dse_console_pane). Only the UI is exposed; it proxies to the
# API from the Next server, so the API stays cluster-internal.
# ---------------------------------------------------------------------------
console:
  enabled: false
  api:
    image: { repository: ghcr.io/fintexinc/dse_console_pane/console-api, tag: "v0.1.0-rc.1" }
    # Import the skill registry from the content vendored into the console-api
    # image, in an initContainer, before the API opens the SQLite file.
    #
    # REQUIRES an image that carries /app/vendor/dse_skills — i.e. one built
    # after the console repo's Dockerfile started vendoring it. Point this at an
    # older image and the pod sits in Init:Error with the panel down. The chart
    # default is `true` because that is the correct steady state; a deployment
    # still pinned to an older console-api tag must set it to false until the
    # tag is bumped in the same change.
    skillsSync:
      enabled: true
    persistence:
      size: 2Gi
      storageClassName: ""
    resources:
      requests: { cpu: "50m", memory: "192Mi" }
      limits: { cpu: "500m", memory: "512Mi" }
  ui:
    image: { repository: ghcr.io/fintexinc/dse_console_pane/console-ui, tag: "v0.1.0-rc.1" }
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits: { cpu: "500m", memory: "768Mi" }
  ingress:
    enabled: false
    className: "traefik"
    host: "console.example.com"
    certResolver: ""
    # The panel has no login of its own. With this on, Traefik checks the queue
    # board's session before forwarding anything here, so both surfaces share
    # one OIDC implementation and one sign-in. Turning it off publishes the
    # panel — and everything it reads — to anyone who knows the hostname.
    forwardAuth:
      enabled: false


# ---------------------------------------------------------------------------
# Operator console (queue board). Complements the admin console: this is the
# surface that can act on a task (kill switch, quarantine, pause, retry).
# Login is OIDC and fails closed — with no verifier configured it answers 503.
# ---------------------------------------------------------------------------
queueBoard:
  enabled: false
  image: { repository: dse/platform, tag: "0.1.0", digest: "" }
  # Shown as a cross-link so an operator can move between the two surfaces, and
  # doubles as the allowlist for where a login is allowed to land: without it
  # set, a sign-in started from the panel returns to the board instead.
  consoleUrl: ""
  # This service's own public origin. Needed only to guard the panel: a
  # forward-auth request carries the PANEL's hostname in every header, so the
  # login URL cannot be inferred from it and has to be stated.
  publicUrl: ""
  # Scope of the session cookie. Set to the parent domain shared by both
  # consoles (".example.com") to make one login cover both; leaving it empty
  # keeps the cookie host-only, which is correct when only one is exposed.
  cookieDomain: ""
  resources:
    requests: { cpu: "50m", memory: "192Mi" }
    limits: { cpu: "400m", memory: "512Mi" }
  ingress:
    enabled: false
    className: "traefik"
    host: "admin.example.com"
    certResolver: ""


adapters:
  slack:
    enabled: true
    image: { repository: dse/adapter-slack, tag: "0.1.0", digest: "" }
    port: 8801
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  github:
    enabled: true
    image: { repository: dse/adapter-github, tag: "0.1.0", digest: "" }
    port: 8802
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
  jira:
    # Off by default: Jira needs a site URL + API token, and enabling it without
    # them would leave the poller crash-looping against a 401.
    enabled: false
    image: { repository: dse/adapter-jira, tag: "0.1.0", digest: "" }
    port: 8804
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
    # The poller and the transition worker are idle loops that wake on an
    # interval; they need far less than the HTTP receiver.
    workerResources:
      requests: { cpu: "40m", memory: "128Mi" }
      limits: { cpu: "300m", memory: "256Mi" }
  teams:
    # Off by default, like jira: without the Azure Bot registration (App ID +
    # secret + tenant id) the adapter denies every request — fail-closed — and
    # an enabled-but-unconfigured deployment would only add a pod that 401s.
    enabled: false
    image: { repository: dse/adapter-teams, tag: "0.1.0", digest: "" }
    port: 8808
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
    ingress:
      # The bot's messaging endpoint must be a public HTTPS URL with a valid
      # certificate — Microsoft has no tunnel exception. Own host because
      # `ingress.host` is a scalar shared by the path-based webhook Ingress.
      enabled: false
      className: "traefik"
      host: ""
      certResolver: "le"
  ingestGateway:
    enabled: true
    image: { repository: dse/ingest-gateway, tag: "0.1.0", digest: "" }
    port: 8803
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits: { cpu: "500m", memory: "256Mi" }
    # The outbox dispatcher — a SECOND process on the same image
    # (`python -m ingest_gateway.dispatcher_main`, templates/dispatcher.yaml).
    # ON by default, in the same group as postgres/temporal/orchestrator rather
    # than the optional integrations (jira, console, preview): it is the only
    # caller of start_workflow, so with it off the install accepts webhooks and
    # runs nothing. It shares the image above on purpose — one process writes
    # `ingest_events`, the other drains it.
    dispatcher:
      enabled: true
      # 1 is enough, not a correctness limit: the drain uses FOR UPDATE SKIP
      # LOCKED and Temporal rejects a duplicate workflow id, so N replicas
      # neither lose nor double-start work (see templates/dispatcher.yaml).
      replicas: 1
      # A 1s poll loop that is idle most of the time; sized like the Jira
      # workers, well below the HTTP receiver above.
      resources:
        requests: { cpu: "40m", memory: "128Mi" }
        limits: { cpu: "300m", memory: "256Mi" }

validation:
  enabled: true
  image: { repository: dse/validation, tag: "0.1.0", digest: "" }
  port: 8807
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# The ledger is implemented by the Postgres schema and the dse_audit package.
# This flag only controls whether the installation requires that path; proof that
# the migrations were applied is deliberately a separate gate above.
auditLedger:
  enabled: true

# ---------------------------------------------------------------------------
# SELF-HOSTED / air-gapped model server (Tier 2, WSD-E5-T2/T3) — OFF under
# topology A (the model-gateway talks to Bedrock over PrivateLink). ON only under
# topology B / the strictest tier, where NO inference data may leave the VPC: the
# model runs in-cluster (GPU) and the model-gateway consumes it in-VPC.
# See infra/helm/dse/values-topology-b.yaml and infra/helm/dse/TOPOLOGY-B.md.
# ---------------------------------------------------------------------------
modelServer:
  enabled: false
  image:
    repository: dse/model-server-airgapped
    tag: "0.1.0"
    digest: ""
  replicas: 1
  port: 8000
  # GPU: in air-gapped production, nvidia.com/gpu requests/limits. Left empty in
  # the base chart so that `helm template` validates without a device plugin.
  gpu: 0
  resources:
    requests: { cpu: "1", memory: "2Gi" }
    limits: { cpu: "4", memory: "8Gi" }

# ---------------------------------------------------------------------------
# Observability (WSF-E7-T1)
# ---------------------------------------------------------------------------
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.105.0"
    digest: ""
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

ingress:
  enabled: false
  className: "nginx"
  host: "dse.example.com"
  tls:
    enabled: true
    secretName: "dse-tls"
    # When set, Traefik obtains the certificate itself via ACME using this
    # resolver and `secretName` is ignored. Requires inbound port 80 to be
    # reachable from the internet — that is how the HTTP-01 challenge is
    # answered, so it is not just for redirects.
    certResolver: ""

# Egress default-deny at the NetworkPolicy level — defence in depth IN ADDITION
# to the egress-proxy (the proxy is the primary line of defence on the
# application data path; the NetworkPolicy is a second, structural layer that
# holds even if the proxy is not correctly configured).
networkPolicy:
  enabled: true
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # Only the egress-proxy gets this egress. In pilot/production the list cannot
  # be left empty. The default suggested in the overlay blocks private networks
  # and the metadata endpoint; the proxy's L7 allowlist remains mandatory.
  egressProxyExternalCidrs: []
  # Route from the orchestrator worker to the K8s API server (the kubectl that
  # creates the sandbox Pods). Required with sandboxDriver=k8s under default-deny.
  # TWO consumers with DIFFERENT addresses (do not mix them up):
  #  - serviceHost: the ClusterIP that kubectl TARGETS (KUBERNETES_SERVICE_HOST,
  #    e.g. 10.43.0.1 on k3s). Goes into the orchestrator's NO_PROXY (otherwise
  #    HTTPS_PROXY hijacks the call). NO_PROXY is port-agnostic.
  #  - cidrs: the endpoint the egress NetworkPolicy has to ALLOW. Under
  #    k3s/Calico/Cilium the policy is evaluated POST-DNAT → usually the NODE IP
  #    (nodeIP/32), not the ClusterIP. VERIFY against the target cluster's CNI.
  #  - port: the endpoint port in the NetworkPolicy rule (6443 on the nodeIP).
  kubeApiServer:
    serviceHost: "10.43.0.1"
    cidrs: []
    port: 6443
