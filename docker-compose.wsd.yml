# WS-D — model-gateway (LiteLLM). See CONVENTIONS.md — connected to the
# external network `dse_net` already created by the foundation. Do not edit
# docker-compose.yml.
#
# Version pinning (WSD-E1-T1): the LiteLLM image is pinned by DIGEST, not by a
# floating tag (`main-latest` changes content silently). The digest below
# corresponds to the litellm==1.93.0 image pulled on 2026-07-09.
# Upgrade procedure: see services/model-gateway/README.md
# §"Version pinning e upgrade simulado" — swap the digest, run
# `services/model-gateway/scripts/smoke_test.py` against the echo model, and
# compare byte for byte with the baseline before promoting.

services:
  model-gateway-echo:
    build:
      context: ./services/model-gateway/echo_provider
    image: dse-model-gateway-echo:local
    container_name: dse_model_gateway_echo
    environment:
      ECHO_PORT: "9000"
    networks: [dse_net]

  # Phase 3 (WSD-E4-T1): SECOND instance of the echo model — same tier
  # ("local-dev"), same image, different endpoint. It is the target of
  # LiteLLM's native intra-tier fallback (see router_settings in
  # litellm_config.yaml). The failover tests take `dse_model_gateway_echo` down
  # FOR REAL (docker stop) and prove this instance takes over, with correct
  # cost/audit attribution — and that both down => clean refusal (P6).
  model-gateway-echo-b:
    build:
      context: ./services/model-gateway/echo_provider
    image: dse-model-gateway-echo:local
    container_name: dse_model_gateway_echo_b
    environment:
      ECHO_PORT: "9000"
      # Distinct upstream name: makes it possible to tell from the
      # logs/responses which instance served (LiteLLM rewrites `model` to the
      # alias, but the x-litellm-model-api-base header keeps the real endpoint).
      ECHO_MODEL_NAME: "echo-model-b"
    networks: [dse_net]

  model-gateway:
    # F2 (audit): image DERIVED from the pinned stock one (Dockerfile.proxy) —
    # the stock image has no Postgres driver and the budget hook would be
    # inert. The pinned digest lives in Dockerfile.proxy's FROM (upgrades stay
    # explicit).
    build:
      # context = monorepo root (same as the release) so Dockerfile.proxy can
      # embed config/hook by the services/model-gateway/... path
      context: .
      dockerfile: services/model-gateway/Dockerfile.proxy
    image: dse-model-gateway-proxy:local
    container_name: dse_model_gateway
    depends_on:
      - model-gateway-echo
      - model-gateway-echo-b
    environment:
      LITELLM_MASTER_KEY: ${DSE_LITELLM_MASTER_KEY:-sk-dse-local-dev-master-key}
      # DEDICATED LiteLLM database (the proxy's internal schema for
      # /key/generate, spend tracking, etc.) — its own `dse_litellm` database
      # on the SAME Postgres instance as the foundation, NEVER the shared
      # control-plane `dse` schema/database. Created once via:
      #   docker exec dse_postgres psql -U dse -d dse -c "CREATE DATABASE dse_litellm OWNER dse;"
      DATABASE_URL: ${DSE_LITELLM_DATABASE_URL:-postgresql://dse:dse_dev_only@dse_postgres:5432/dse_litellm}
      DSE_ECHO_PROVIDER_URL: "http://model-gateway-echo:9000"
      DSE_ECHO_PROVIDER_B_URL: "http://model-gateway-echo-b:9000"
      DSE_ECHO_PROVIDER_API_KEY: ${DSE_ECHO_PROVIDER_API_KEY:-sk-eco-local-dev-not-a-real-key}
      # PoC: Anthropic key injected from Vault at boot (see Makefile/README);
      # never hardcoded here. If empty, the anthropic/claude model simply does
      # not answer — the rest of the gateway (echo/failover) keeps working.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Candidate set for the Coder A/B (see litellm_config.yaml). Same rule as
      # the Anthropic key: empty means that one alias does not answer and the
      # rest of the gateway is unaffected — the eval suite reports it SKIPPED
      # (a provider 4xx is a skip, not a failure: eval_suite/runner.py:131).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      DSE_ZAI_API_BASE: ${DSE_ZAI_API_BASE:-https://api.z.ai/api/paas/v4}
      # Production placeholders (Bedrock/PrivateLink) — no real value available
      # in this dev session; see litellm_config.yaml and README.
      DSE_AWS_REGION: ${DSE_AWS_REGION:-us-east-1}
      DSE_BEDROCK_PRIVATELINK_ENDPOINT: ${DSE_BEDROCK_PRIVATELINK_ENDPOINT:-https://vpce-PLACEHOLDER.bedrock-runtime.us-east-1.vpce.amazonaws.com}
      DSE_BEDROCK_IAM_ROLE_ARN: ${DSE_BEDROCK_IAM_ROLE_ARN:-arn:aws:iam::000000000000:role/dse-model-gateway-PLACEHOLDER}
      # Plan 08 §F (F2): the pre-call hook reads the CONTROL-PLANE Postgres
      # (schema `dse`: kill-switch/budgets/ledger) — distinct from the proxy's
      # internal DATABASE_URL (`dse_litellm`). Read-only in practice (the hook
      # only does SELECTs + one append-only INSERT into audit_log).
      DSE_DATABASE_URL: ${DSE_DATABASE_URL:-postgresql://dse_app:dse_app_dev_only@dse_postgres:5432/dse}
    volumes:
      - ./services/model-gateway/litellm_config.yaml:/app/config.yaml:ro
      # F2: mounts the hook in the proxy's CWD (/app is on PYTHONPATH → the
      # dse_budget_hook import resolves).
      - ./services/model-gateway/dse_budget_hook.py:/app/dse_budget_hook.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    networks: [dse_net]

networks:
  dse_net:
    external: true
