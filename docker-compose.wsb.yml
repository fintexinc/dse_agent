services:
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: dse_orchestrator
    environment:
      DSE_TEMPORAL_ADDRESS: temporal:7233
      DSE_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_AUDIT_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      DSE_IDENTITY_DATABASE_URL: postgresql://dse_app:dse_app_dev_only@postgres:5432/dse
      # Plan 08 §F (F5) — Worker Deployment Versioning (modern, PINNED).
      # build_id PINNED per deploy (no longer "dev") + deployment name. Pin
      # DSE_WORKER_BUILD_ID to the image SHA/tag in production (e.g. git-abc123).
      # DSE_WORKER_USE_VERSIONING defaults to OFF: turning it on requires the
      # server with deployment versioning enabled + the cutover via CLI
      # (`temporal worker-deployment set-current-version`). See RUNBOOK.md
      # §Worker-Versioning. With ON, in-flight workflows drain on the old
      # version (PINNED) and only new ones go to the current version.
      DSE_WORKER_BUILD_ID: ${DSE_WORKER_BUILD_ID:-v1}
      DSE_WORKER_DEPLOYMENT_NAME: ${DSE_WORKER_DEPLOYMENT_NAME:-dse-orchestrator}
      DSE_WORKER_USE_VERSIONING: ${DSE_WORKER_USE_VERSIONING:-false}
      DSE_ORCHESTRATOR_HEALTH_PORT: "8900"
      # Activity heartbeat: 60s was killing coder/tester in an infinite retry
      # loop when the machine saturates (Coder CLI + npm + >1 work item — the
      # single-process worker's event loop goes >60s without heartbeating and
      # the server cancels an ALREADY FINISHED ACTIVITY; found in the Slack
      # run of 2026-07-22, wi_d05c/wi_257d, 11+7 attempts). 600s gives room;
      # the 1h start_to_close is still the real ceiling.
      DSE_ACTIVITY_HEARTBEAT_SECONDS: ${DSE_ACTIVITY_HEARTBEAT_SECONDS:-600}
      # Phase 3 (enabling the history alert, ALERTING-RULES.md §3 with WS-F):
      # set DSE_OTEL_EXPORTER=otlp to send traces + the
      # dse.workflow.history_length metric to WS-F's otel-collector (port 4317).
      DSE_OTEL_EXPORTER: ${DSE_OTEL_EXPORTER:-console}
      DSE_OTEL_EXPORTER_OTLP_ENDPOINT: ${DSE_OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      # Phase 3 (WSB-E4-T2/ADR-26) — caps and debounce configurable without redeploy:
      DSE_REVIEW_ROUND_CAP: ${DSE_REVIEW_ROUND_CAP:-20}
      DSE_EVIDENCE_DEBOUNCE_SECONDS: ${DSE_EVIDENCE_DEBOUNCE_SECONDS:-300}
      DSE_EVIDENCE_REFRESH_CAP: ${DSE_EVIDENCE_REFRESH_CAP:-5}
      # Phase 2 (WSB-E1-T3) — worker-side fairness (per-tenant concurrency caps
      # read from tenant_config). "native" only when the server is 1.31+.
      DSE_FAIRNESS_MODE: ${DSE_FAIRNESS_MODE:-worker-side}
      # Phase 2 (WSB-E3-T2) — approval gate POLICY (P1: outside the model).
      DSE_REQUIRE_APPROVAL_RISK_CLASSES: ${DSE_REQUIRE_APPROVAL_RISK_CLASSES:-high}
      # DSE status -> Jira column map (moves the card on the board). The default
      # covers In Progress / In Review / Done; blocked/escalated/failed point to
      # a "Blocked" column that NOT every board has. The override below maps
      # those 3 to "" (no-op: the card stays where it is and the failure comment
      # explains) — boards with a Blocked column can override with the real name.
      DSE_JIRA_STATUS_MAP: ${DSE_JIRA_STATUS_MAP:-{"blocked":"","escalated":"","failed":""}}
      # Consumed by the cross-workstream Activities registered in this single
      # worker (WS-C sandbox_runtime + WS-E dse_validation, see worker.py):
      DSE_MODEL_GATEWAY_URL: http://model-gateway:4000
      # model_gateway_client (real planner via gateway) uses THIS env name:
      DSE_MODEL_GATEWAY_BASE_URL: http://model-gateway:4000
      DSE_SANDBOX_STATE_DIR: /tmp/dse-sandboxes
      # PoC (2026-07-21): the Coder points to the real Anthropic alias on the
      # gateway and mints the virtual key via /key/generate with the master key
      # (control plane). Economy mode (2026-07-22): Haiku 4.5 by default (~3x
      # cheaper). To go back to Sonnet: DSE_CODER_MODEL=anthropic/claude ./dse.sh start.
      # Planner/Tester inherit it (DSE_PLANNER_MODEL/DSE_TESTER_MODEL override).
      DSE_CODER_MODEL: ${DSE_CODER_MODEL:-anthropic/claude-haiku}
      # Chosen model (2026-09-10): Gemini 3.8 Flash for every stage that goes
      # through plain /v1/chat/completions. Those switch with nothing but this
      # variable — no image, no substrate. The Coder is NOT among them: it
      # drives the Claude Code CLI, which speaks the Anthropic Messages API, so
      # DSE_CODER_MODEL stays on Anthropic until either the /v1/messages probe
      # in services/model-gateway/README.md passes for this alias, or the
      # agent-runner is rebuilt with INSTALL_OPENHANDS=1. Pointing the Coder
      # here before one of those two is a mid-turn failure, not a clean one.
      DSE_PLANNER_MODEL: ${DSE_PLANNER_MODEL:-gemini/flash}
      DSE_TESTER_MODEL: ${DSE_TESTER_MODEL:-gemini/flash}
      DSE_ROUTER_MODEL: ${DSE_ROUTER_MODEL:-gemini/flash}
      DSE_L2_MODEL: ${DSE_L2_MODEL:-gemini/flash}
      # Read by the gateway (docker-compose.wsd.yml) — repeated here because
      # the worker mints the virtual key scoped to the alias above.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DSE_CODER_SUBSTRATE: ${DSE_CODER_SUBSTRATE:-fake}
      # S7 (Phase 5) — L1 configured for the PoC repo (fintex-wallet, JS):
      # the Python checks (lint/typecheck/build) are skipped (empty command);
      # the real test is a syntax check of the entrypoint (node --check, without
      # node_modules). secret-scan + diff-budget/forbidden-paths (language
      # agnostic) stay active. NOTE: deriving the L1 commands from the repo
      # itself (package.json/Makefile) is future work — today it is env config.
      DSE_L1_LINT_CMD: ${DSE_L1_LINT_CMD:-}
      DSE_L1_TYPECHECK_CMD: ${DSE_L1_TYPECHECK_CMD:-}
      DSE_L1_BUILD_CMD: ${DSE_L1_BUILD_CMD:-}
      DSE_L1_TEST_CMD: ${DSE_L1_TEST_CMD:-node --check server.js}
      DSE_LITELLM_MASTER_KEY: ${DSE_LITELLM_MASTER_KEY:-sk-dse-local-dev-master-key}
      DSE_MODEL_GATEWAY_ALLOW_FIXTURE: ${DSE_MODEL_GATEWAY_ALLOW_FIXTURE:-1}
      # S7-c: sandbox image with git+node (L1 `node --check` + finalize push run
      # via docker exec INSIDE the sandbox). dse-sandbox-base (WSC-E3-T4b).
      DSE_SANDBOX_IMAGE: ${DSE_SANDBOX_IMAGE:-dse-sandbox-base:wsc3}
      # S7 (Phase 5) — the PoC's IN-PROCESS mode: the Coder substrate (claude-
      # agent-sdk) runs in THIS control-plane process, so the real code lives in
      # the LOCAL workspace (DSE_SANDBOX_STATE_DIR/<wi>/workspace) and NOT in the
      # ephemeral container's /workspace (empty under docker-out-of-docker). With
      # that, L1 and finalize (git push) operate on that local workspace via a
      # subprocess. Production (agent INSIDE the container) does NOT set this
      # flag → it uses DockerExec.
      DSE_SANDBOX_INPROCESS: ${DSE_SANDBOX_INPROCESS:-1}
      # GitHub App credentials injected from Vault at boot (see make up-poc);
      # finalize_pr (WS-E) runs here in the orchestrator and needs them to open PRs.
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      # Plan 08 §D (D1/D3/D4) — trigger_preview runs in THIS worker.
      # Internal KUBECONFIG (dse_net network; generate it with infra/k8s-local/
      # gen-kubeconfig-internal.sh after creating the cluster). The PR link uses
      # EXTERNAL_HOST: local = *.preview.localhost:8081 (k3d's Traefik published
      # on the host). To expose it via a Cloudflare/VPS tunnel later: just swap
      # the template (see infra/preview-exposure.md) — the Ingress keeps the
      # same hostname.
      KUBECONFIG: /app/infra/kubeconfig-internal.yaml
      DSE_PREVIEW_KUBE_CONTEXT: ${DSE_PREVIEW_KUBE_CONTEXT:-k3d-dse-preview}
      DSE_PREVIEW_EXTERNAL_HOST: ${DSE_PREVIEW_EXTERNAL_HOST:-http://{namespace}.preview.localhost:8081}
      DSE_PREVIEW_BUILD_IMAGE: ${DSE_PREVIEW_BUILD_IMAGE:-true}
      DSE_PREVIEW_REGISTRY_PUSH: ${DSE_PREVIEW_REGISTRY_PUSH:-localhost:5510}
      DSE_PREVIEW_REGISTRY_PULL: ${DSE_PREVIEW_REGISTRY_PULL:-k3d-dse-registry:5510}
      DSE_PREVIEW_APP_PORT: ${DSE_PREVIEW_APP_PORT:-80}
    ports:
      - "8900:8900"
    volumes:
      # Docker-outside-of-Docker: the worker (trusted control plane) needs the
      # host socket to provision/destroy the sandbox containers via
      # sandbox_runtime.docker_driver. This is distinct from, and does not
      # contradict, the rule that the sandbox itself has no socket (P2/ADR-11) —
      # the sandbox never receives this mount, only the process that creates it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Robustness (observed live): the tasks' workspaces/checkpoints
      # (DSE_SANDBOX_STATE_DIR) lived in the CONTAINER's /tmp — every worker
      # recreate destroyed the state of EVERY in-flight task. Mounted from the
      # host: (a) it survives a worker restart/deploy; (b) it is coherent with
      # docker-outside-of-docker — the daemon mounts this SAME host path into
      # the sandbox's /workspace, so the sandbox container now sees the real
      # files (it used to see an empty directory).
      - /tmp/dse-sandboxes:/tmp/dse-sandboxes
      # Plan 08 §D — preview: internal kubeconfig (ro) + the GitOps repo of
      # manifests (rw — the worker writes; dse-wse-gitserver serves the SAME
      # host path read-only for Argo CD to pull).
      - ./infra/k8s-local/kubeconfig-internal.yaml:/app/infra/kubeconfig-internal.yaml:ro
      - ./services/validation/preview_repo:/app/services/validation/preview_repo
    depends_on:
      - postgres
      - temporal
    networks: [dse_net]
    restart: unless-stopped

networks:
  dse_net:
    external: true
