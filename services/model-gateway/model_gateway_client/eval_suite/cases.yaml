# Tier-2 evaluation suite for the model-gateway (WSD-E5-T1). Owner: WS-D.
#
# Every case has:
#   id          — stable identifier
#   model       — LiteLLM alias (model_name from litellm_config.yaml)
#   messages    — OpenAI-compatible payload sent to the gateway
#   assertions  — list of checks over the response. Supported types
#                 (see runner.py):
#     - equals            {value: "..."}        content == value (exact)
#     - contains          {value: "..."}        value in content
#     - deterministic     {}                     run twice -> same content
#     - tokens_positive   {}                     tokens_in>0 and tokens_out>0
#     - max_cost_usd      {value: 0.01}          cost_usd <= value
#
# Note: the `eco/echo-model` cases rely on the echo provider's known
# deterministic transform (ECHO[<last user message reversed>]) — that is why
# an `equals` assertion is possible and stable. Cases for `bedrock/*` use
# looser assertions (contains/tokens) because a real LLM is not
# byte-deterministic; they are SKIPPED automatically when the AWS infra is
# unavailable (see runner.py).

cases:
  - id: echo-determinism
    model: eco/echo-model
    messages:
      - role: user
        content: "reference prompt one"
    assertions:
      - type: deterministic
      - type: tokens_positive

  - id: echo-known-transform
    model: eco/echo-model
    messages:
      - role: user
        content: "abc"
    assertions:
      - type: equals
        value: "ECHO[cba]"

  - id: echo-nonempty
    model: eco/echo-model
    messages:
      - role: system
        content: "you are a code assistant"
      - role: user
        content: "summarize the diff"
    assertions:
      - type: contains
        value: "ECHO["
      - type: max_cost_usd
        value: 1.0

  # Reference case for the production tier (Bedrock). SKIPPED without AWS.
  - id: bedrock-sonnet-smoke
    model: bedrock/anthropic.claude-3-5-sonnet
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive

  # --- Coder candidate set (2026-09-09) -------------------------------------
  # Four aliases, one case each, same prompt: the objective gate before any of
  # them is promoted to DSE_CODER_MODEL. An alias whose key is unset answers
  # with a provider 4xx and is reported SKIPPED, not failed (runner.py:131), so
  # this block is safe to run with none of the new credentials configured.
  #
  # The `max_cost_usd` assertion is doing real work here: it is also the check
  # that the hardcoded prices in litellm_config.yaml actually reached the
  # proxy. A model whose price is missing from the cost map reports cost 0.0,
  # which passes any ceiling — so read the reported cost, do not just watch the
  # suite go green. Zero on a real answer means the price did not land.
  - id: candidate-haiku
    model: anthropic/claude-haiku
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive
      - type: max_cost_usd
        value: 0.01

  - id: candidate-gemini-flash
    model: gemini/flash
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive
      - type: max_cost_usd
        value: 0.01

  - id: candidate-luna
    model: openai/luna
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive
      - type: max_cost_usd
        value: 0.01

  - id: candidate-glm-flash
    model: zai/glm-flash
    messages:
      - role: user
        content: "Reply with the single word: ok"
    assertions:
      - type: tokens_positive
      - type: max_cost_usd
        value: 0.01
