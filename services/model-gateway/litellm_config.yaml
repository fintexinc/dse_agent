# Fintex DSE — WS-D — LiteLLM proxy config (model-gateway).
#
# Version pinning: see docker-compose.wsd.yml at the repo root — the image is
# pinned by DIGEST (not by a "main-latest" tag), so that an "upgrade" is an
# explicit act (swap the digest + run scripts/smoke_test.py before bringing it
# up in any shared environment). See README.md §"Version pinning and simulated
# upgrade" for the full procedure.
#
# Two model tiers registered:
#   1. `bedrock/*`  — production tier via AWS Bedrock over VPC PrivateLink.
#      There is no AWS account available in this development session — the
#      values below are PLACEHOLDERS documenting exactly the expected shape
#      of the real config (see README).
#   2. `eco/echo-model` — local/dev tier: a real "custom" provider, pointing at
#      echo_provider/server.py (its own HTTP process, no cost, no external
#      dependency), registered like any other OpenAI-compatible provider (the
#      same mechanism used for vLLM/Ollama/etc. in production).
#      Lets the gateway be tested end-to-end without any paid credential.

model_list:
  # --- Tier 1: Bedrock / PrivateLink (production — placeholders, see README) ---
  - model_name: bedrock/anthropic.claude-3-5-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: os.environ/DSE_AWS_REGION
      # PrivateLink VPC endpoint for bedrock-runtime — replace with the real ID
      # provisioned by the infra team (WS-F / the customer's AWS platform).
      aws_bedrock_runtime_endpoint: os.environ/DSE_BEDROCK_PRIVATELINK_ENDPOINT
      # IAM role assumed by the gateway (via IRSA/web-identity on EKS, or an
      # instance profile on EC2) — never a static access key.
      aws_role_name: os.environ/DSE_BEDROCK_IAM_ROLE_ARN
      aws_web_identity_token: os.environ/AWS_WEB_IDENTITY_TOKEN_FILE
    model_info:
      dse_tier: 1
      dse_requires_infra: "aws_bedrock_privatelink"

  - model_name: bedrock/anthropic.claude-3-haiku
    litellm_params:
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_region_name: os.environ/DSE_AWS_REGION
      aws_bedrock_runtime_endpoint: os.environ/DSE_BEDROCK_PRIVATELINK_ENDPOINT
      aws_role_name: os.environ/DSE_BEDROCK_IAM_ROLE_ARN
      aws_web_identity_token: os.environ/AWS_WEB_IDENTITY_TOKEN_FILE
    model_info:
      dse_tier: 1
      dse_requires_infra: "aws_bedrock_privatelink"

  # --- Local/dev tier: echo model, working right now, at no cost ---
  - model_name: eco/echo-model
    litellm_params:
      model: openai/echo-model
      api_base: os.environ/DSE_ECHO_PROVIDER_URL
      # Phase 1 integration finding (WS-F scanner,
      # scripts/scan_for_plaintext_secrets.py): this was the only entry in the
      # file with a literal value instead of an `os.environ/...` indirection —
      # the echo provider does not require a real credential (it is not a real
      # secret), but for consistency with the rest of the file and so the
      # scanner does not need a special exception, it was moved to an env var
      # with a non-sensitive default.
      api_key: os.environ/DSE_ECHO_PROVIDER_API_KEY
      # Phase 3 (WSD-E4-T1): local endpoints — a connection failure must be
      # detected FAST for the intra-tier failover to be deterministic
      # (without this, the default ~10s connect timeouts × the SDK's internal
      # retries push the failover past the client's own timeout).
      timeout: 5
      max_retries: 0
    model_info:
      dse_tier: "local-dev"
      dse_requires_infra: "none"

  # Phase 3 (WSD-E4-T1): second echo instance — target of the INTRA-TIER
  # failover. SAME dse_tier ("local-dev") as the primary, by construction: the
  # negative test test_failover_intra_tier.py::test_no_fallback_route_crosses_tier
  # parses this file and fails CI if any fallback route points at a model in a
  # different tier (NFR-07/P2 — never a silent fallback across tiers).
  - model_name: eco/echo-model-b
    litellm_params:
      model: openai/echo-model-b
      api_base: os.environ/DSE_ECHO_PROVIDER_B_URL
      api_key: os.environ/DSE_ECHO_PROVIDER_API_KEY
      timeout: 5
      max_retries: 0
    model_info:
      dse_tier: "local-dev"
      dse_requires_infra: "none"

  # PoC (2026-07-21): the Anthropic API directly, for the real end-to-end test —
  # Coder/Planner write actual code. The key comes from Vault
  # (secret/dse/model-gateway/providers → anthropic_api_key), injected as
  # ANTHROPIC_API_KEY into the gateway container at boot (NEVER in a file/git).
  # POSTURE NOTE: this is the PoC shortcut — it calls Anthropic's public API,
  # not in-VPC Bedrock/PrivateLink (Tier 1 of the proposal). For production,
  # swap to bedrock/* (already registered above). Documented, not silent.
  - model_name: anthropic/claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "anthropic_public_api"
      # $2/$10 per MTok. Hardcoded for the same reason as the candidates below,
      # with an extra wrinkle: this alias IS in the cost map of the pinned
      # LiteLLM 1.93.0 (2026-07-09), but at the rate of the day. Anthropic made
      # $2/$10 permanent on 2026-08-11, after the pin — so the bundled map is
      # stale rather than absent, which is worse: it reports a wrong number
      # instead of none, and nothing looks broken. Setting it here wins.
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001

  # Economy mode (operator request, 2026-07-22). It is the DEFAULT for the flow
  # (DSE_CODER_MODEL in compose); Sonnet stays registered above — going back is
  # changing 1 env var, nothing more.
  #
  # CORRECTION 2026-09-11: the original note here said "~3x cheaper, $1/$5 vs
  # $3/$15". $3/$15 is SONNET 4.6's price. Sonnet 5, which is what
  # anthropic/claude actually serves, is $2/$10 — so this alias is 2x cheaper,
  # not 3x, and the economy argument is half of what it was written to be.
  - model_name: anthropic/claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "anthropic_public_api"
      # $1/$5 per MTok. In the pinned cost map, and unchanged since — set here
      # anyway so the two aliases being compared are priced the same way.
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # --- Candidate set for the Coder A/B (2026-09-09) -------------------------
  # The three entries below + `anthropic/claude-haiku` above are the four
  # aliases the eval suite compares. They exist to be MEASURED; none is the
  # default. Switching a stage to one of them is an env var
  # (DSE_CODER_MODEL/DSE_PLANNER_MODEL/DSE_TESTER_MODEL) — the virtual key is
  # minted scoped to whatever that var holds (sandbox_runtime/
  # model_gateway_client.py:75), so nothing else needs to know.
  #
  # THREE THINGS ARE DELIBERATE IN EVERY BLOCK:
  #
  # 1. `input_cost_per_token`/`output_cost_per_token` are HARDCODED. This image
  #    is pinned to LiteLLM 1.93.0 (2026-07-09) and all three models shipped
  #    after that, so they are absent from its bundled cost map. Without these
  #    the proxy returns no `x-litellm-response-cost-original`, `_extract_cost`
  #    reads 0.0 (model_gateway_client/gateway_call.py:225-232) and the budget
  #    cap, the kill switch and the ledger all go silently blind. The
  #    alternative — `POST /reload/model_cost_map` — fetches prices from GitHub
  #    at runtime, which is both a new egress hole and a moving price behind a
  #    digest-pinned image. Prices are per TOKEN (list ÷ 1e6).
  #
  # 2. Each declares its own `timeout`. The two anthropic groups above declare
  #    none and inherit `litellm_settings.request_timeout: 30` as their
  #    PER-ATTEMPT cap; a reasoning model on a coding turn crosses 30s
  #    routinely. Raising the global one instead would change the cap for every
  #    group and invalidate the calibration in tests/test_router_calibration.py.
  #
  # 3. No `fallbacks:` route points at any of them — they are single-deployment
  #    groups like `anthropic/*`, and a route across `dse_tier` is what
  #    tests/test_failover_intra_tier.py::test_no_fallback_route_crosses_tier
  #    exists to forbid.

  # Gemini 3.8 Flash (GA 2026-09-02). Terminal-Bench 2.1 90.8, SWE-bench Pro
  # 61.6. Registered here against AI Studio because it needs ONE bearer key,
  # like every other entry in this file. For production swap the two
  # litellm_params for Vertex — same model, enterprise path, but a
  # service-account JSON that has to be mounted, not an env string:
  #     model: vertex_ai/gemini-3.8-flash
  #     vertex_project: os.environ/DSE_VERTEX_PROJECT
  #     vertex_location: os.environ/DSE_VERTEX_LOCATION
  # PRICE EXPIRES: $0.75/$3.75 is promotional through 2026-12-31; from
  # 2027-01-01 it is $1.50/$7.50 — double the two values below on that date.
  - model_name: gemini/flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 120
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "google_ai_studio_api"
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375

  # GPT-5.6 Luna (2026-07-09). Terminal-Bench 2.1 84.7 at $0.20/$1.20 — the
  # cheapest of the three per token once you account for `max` reasoning
  # effort, which is the tier that scores 84.7 and the tier that spends the
  # tokens. Artificial Analysis lists Amazon as a serving provider alongside
  # OpenAI: if Bedrock serves it in our region, swap the two litellm_params for
  # the `bedrock/*` shape used at the top of this file (aws_role_name +
  # aws_bedrock_runtime_endpoint) and the model stops being a new vendor in the
  # security review altogether. Verify with GET /v1/models on our own account
  # before planning on it.
  - model_name: openai/luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "openai_public_api"
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000012

  # GLM-5.3-Flash (Z.ai/Zhipu, 2026-08-26). Terminal-Bench 2.1 84.3 at
  # $0.15/$0.50 list — the launch promo ($0.075/$0.25) ended 2026-09-09, the
  # values below are list. Registered through the OpenAI-compatible shape, the
  # same mechanism as eco/echo-model.
  # POSTURE NOTE, read before pointing the Coder at this: as configured here it
  # sends repository contents to a Chinese-hosted endpoint. That is a client
  # data-residency decision, not an engineering one. The weights are MIT and
  # self-hostable (SGLang/vLLM, 320B total / 18B active) — served from the
  # in-cluster modelServer (infra/helm/dse/values.yaml:561) the question does
  # not arise and there is no per-token bill at all.
  - model_name: zai/glm-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: os.environ/DSE_ZAI_API_BASE
      api_key: os.environ/ZAI_API_KEY
      timeout: 120
    model_info:
      dse_tier: "poc-direct-api"
      dse_requires_infra: "zai_public_api"
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000005

# Phase 3 (WSD-E4-T1): intra-tier failover NATIVE to the proxy (LiteLLM router).
# Declarative, outside the agents' code (P1): if the primary deployment fails
# (connection refused / 5xx / timeout), the router tries the fallback ON THE
# SAME LINE — and only that one. There is no fallback route to bedrock/* here
# (it would cross the contracted tier) and there never will be: see the negative
# test cited above. The client detects the degradation via the
# x-litellm-attempted-fallbacks header (>0) + x-litellm-model-api-base, and
# emits the degradation audit row (P8) — see model_gateway_client/failover.py.
router_settings:
  # One retry inside the model group before the router moves on to the declared
  # fallback. The fallback itself is a RUNTIME decision (async_function_with_
  # fallbacks) — it does not need the primary deployment to be "cooled down".
  num_retries: 1
  # This pair deliberately amounts to "practically never take a deployment out
  # of the pool", and that is the SAFE setting here — not an oversight.
  #
  # How LiteLLM 1.93.0 reads it (router_utils/cooldown_handlers.py):
  # `_should_cooldown_deployment` switches to the LEGACY counting path as soon as
  # `allowed_fails` differs from the library default (litellm.allowed_fails = 3)
  # or an `allowed_fails_policy` is set. That path
  # (`should_cooldown_based_on_allowed_fails_policy`) keeps the per-deployment
  # failure counter in `Router.failed_calls` with `ttl=cooldown_time` and cools
  # the deployment down only once `fails > allowed_fails`. With ttl=1s that means
  # 2 coolable failures inside one second, while a single attempt against a dead
  # endpoint already burns that deployment's own `timeout` — so no deployment is
  # ever cooled down in practice, and the intra-tier failover below is served by
  # the runtime fallback instead.
  #
  # 2026-07-26 — DO NOT set `allowed_fails: 0` here (it was tried and reverted).
  # `router_settings` is ROUTER-WIDE, and `anthropic/claude*` and `bedrock/*` are
  # single-deployment model groups with NO fallback route: the first coolable
  # failure would take the whole group out of service for the cooldown window,
  # and the proxy turns "No deployments available" into HTTP 429 for EVERY tenant
  # (litellm/proxy/_types.py). A plain timeout is coolable (`_is_cooldown_required`
  # returns True for 408) and `litellm_settings.request_timeout: 30` below is the
  # PER-ATTEMPT cap for those two groups — they declare no `timeout` of their own,
  # so litellm_core_utils/completion_timeout.py resolves the global one. One long
  # generation crossing 30s would therefore have taken the production model group
  # down for 30s. Making a chaos test deterministic is not worth that: the test
  # harness was fixed instead (tests/chaos_helpers.py).
  #
  # Also do NOT add `BadRequestErrorAllowedFails` / `ContentPolicyViolationError-
  # AllowedFails` leniency entries here: `_is_cooldown_required` returns True in
  # the 4xx range only for 429/401/408/404, so a 400 never reaches the
  # allowed-fails policy at all and such entries are inert.
  cooldown_time: 1
  allowed_fails: 1
  fallbacks:
    - eco/echo-model: ["eco/echo-model-b"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No `database_url`: LiteLLM keeps virtual keys in process memory (lost on a
  # container restart). Acceptable for local Phase 1 — see the README for the
  # production plan (a dedicated Postgres, NEVER the shared `dse` schema used
  # by the control-plane).
  allow_requests_on_db_unavailable: true

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 30
  # Plan 08 §F (F2) — SERVER-SIDE budget + kill-switch pre-call hook. Runs
  # INSIDE the proxy (non-bypassable): every call goes through
  # DseBudgetKillSwitchHook.async_pre_call_hook, which reads X-Dse-Tenant-Id/
  # X-Dse-Work-Item-Id and refuses (402 budget / 403 kill-switch) against the
  # control-plane Postgres (DSE_DATABASE_URL). Mirrors the client's enforce_call
  # (defence in depth). The module is mounted at /app/dse_budget_hook.py (compose).
  callbacks: ["dse_budget_hook.proxy_handler_instance"]
