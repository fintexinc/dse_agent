[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse-contracts"
version = "0.4.1"
description = "Shared Fintex DSE contracts (ConversationEvent, WorkItem, PlanArtifact, gateway, mutable comment)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["dse_contracts*"]
